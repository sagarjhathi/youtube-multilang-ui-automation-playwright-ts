name: Playwright tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      canary:
        description: "Canary run: spoil one value in every test on purpose, every test has to FAIL. Reports go to the canary/ folder of gh-pages, the real reports are not touched"
        type: boolean
        default: false
      lose_a_shard:
        description: "Test of the report check: shard 2 fails on purpose before its tests start, so the red box on the report page has to name its tests. Never use this on a normal run"
        type: boolean
        default: false
  schedule:
    # every night at 01:30 IST (GitHub cron runs in UTC: 20:00 UTC = 01:30 IST the next morning)
    - cron: "0 20 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    env:
      # RunConfig reads this: true only for the nightly run, which then uses the ...CI keys in configs/runconfig.json
      IS_CRON: ${{ github.event_name == 'schedule' }}
    steps:
      # Only for a manual run with "lose_a_shard" ticked: shard 2 stops here, before any test, like a cancelled shard.
      - name: Lose a shard on purpose
        if: ${{ inputs.lose_a_shard && matrix.shardIndex == 2 }}
        run: |
          echo "::error::Shard 2 fails on purpose (lose_a_shard input), its tests will not run"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The package download on the runner sometimes hangs (one shard waited 90 minutes and was cancelled).
      # Each try is stopped after 8 minutes and tried again, up to 3 times.
      - name: Install Chromium
        timeout-minutes: 30
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=20 480 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Install attempt $attempt failed or timed out"
            sleep 10
          done
          exit 1

      # the reporters (blob for the merged HTML report, allure-results) and the other CI settings come from playwright.config.ts (CI=true)
      - name: Run Playwright tests
        env:
          CANARY: ${{ inputs.canary }}
        run: npx playwright test tests/YtMasterSafeActions.spec.ts --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 7

      - name: Upload allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shardIndex }}
          path: allure-results
          retention-days: 7

  merge-reports:
    name: Merge reports
    needs: test
    # run even when some shards failed, so the report is always produced
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # needed to push the reports to the gh-pages branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports from all shards
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      # the same results as a json file, to count the tests in the last step
      - name: Merge into one json file
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-results.json
        run: npx playwright merge-reports --reporter=json ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      # allure-commandline needs Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download allure results from all shards
        uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true

      # The gh-pages branch holds the published reports; we need the previous Allure report
      # from it to carry the trend history forward. On the very first run the branch does not exist yet.
      - name: Check whether gh-pages exists
        id: pages_branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out gh-pages
        if: steps.pages_branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Start an empty site folder (first run only)
        if: steps.pages_branch.outputs.exists != 'true'
        run: |
          mkdir site
          cd site
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Copy previous Allure history (for trend graphs)
        run: |
          if [ -d site/allure/history ]; then
            cp -r site/allure/history allure-results/history
          fi

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      # ---- Publish ----
      # Pull requests only build the reports; pushes to main or master and manual runs publish.

      # A canary run is switched on by the "canary" input of a manual run or by "CANARY": true in configs/runconfig.json
      - name: Is this a canary run?
        id: canary
        run: |
          if [ "${{ inputs.canary }}" = "true" ] || [ "$(node -p "require('./configs/runconfig.json').CANARY === true")" = "true" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi

      # A green report must not hide lost or failed tests (once a shard waited 90 minutes in the Chromium install and was cancelled).
      # Simple check: the number of tests with a result has to equal the number of tests in the spec, every shard has to send a report,
      # and the failed tests are counted. Only when something is wrong, the tests are named. The problem is shown in several places
      # (a red box on the report page, an error annotation and the summary of the run) but it never stops the publish.
      - name: Check that all shards ran, all tests completed and none failed
        id: coverage
        run: |
          shards_expected=4   # shardTotal of the test job
          shards_found=$(ls all-blob-reports/*.zip | wc -l)
          npx playwright test tests/YtMasterSafeActions.spec.ts --list | grep ' › ' | sed 's/.* › //' > tests-in-spec.txt
          node -p 'const t = []; (function walk(s) { (s.specs || []).forEach(x => t.push(x.title)); (s.suites || []).forEach(walk); })(require("./merged-results.json")); t.join("\n")' > tests-with-result.txt
          # a test failed when its result in the merged report is not ok (a retry that passes counts as passed)
          node -p 'const t = []; (function walk(s) { (s.specs || []).forEach(x => { if (!x.ok) t.push(x.title); }); (s.suites || []).forEach(walk); })(require("./merged-results.json")); t.join("\n")' > tests-failed.txt
          tests_expected=$(grep -c . tests-in-spec.txt || true)
          tests_found=$(grep -c . tests-with-result.txt || true)
          tests_failed=$(grep -c . tests-failed.txt || true)
          echo "Shards: $shards_found of $shards_expected | tests with a result: $tests_found of $tests_expected | failed: $tests_failed"

          problems=""
          if [ "$shards_found" -ne "$shards_expected" ] || [ "$tests_found" -ne "$tests_expected" ]; then
            # the tests of the spec that have no result at all
            missing=$(grep -vxFf tests-with-result.txt tests-in-spec.txt | sed ':a;N;$!ba;s/\n/, /g')
            problems="Only $tests_found of $tests_expected tests have a result ($shards_found of $shards_expected shards sent a report). A shard was probably cancelled or failed before the tests started. Tests that did not run: $missing."
          fi
          if [ "$tests_failed" -gt 0 ]; then
            failed=$(sed ':a;N;$!ba;s/\n/, /g' tests-failed.txt)
            problems="$problems $tests_failed test(s) failed: $failed."
          fi

          if [ -z "$problems" ]; then
            : > coverage-warning.html
            : > coverage-message.txt
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "$problems"
            echo "$problems" > coverage-message.txt
            echo "<div class=\"warning\"><strong>This run has problems</strong> $problems</div>" > coverage-warning.html
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to gh-pages
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          cd site
          if [ "${{ steps.canary.outputs.on }}" = "true" ]; then
            # Canary run: the reports go to canary/ and the real reports stay as they are.
            rm -rf canary
            mkdir canary
            cp -r ../playwright-report canary/playwright
            cp -r ../allure-report canary/allure
          else
            # Start from a clean folder: remove the old reports, then add the new ones.
            rm -rf playwright allure index.html
            cp -r ../playwright-report playwright
            cp -r ../allure-report allure
            cp ../.github/pages/index.html index.html
            sed -i "s|__RUN_INFO__|Run #${{ github.run_number }} - commit ${GITHUB_SHA::7} - $(date -u +'%Y-%m-%d %H:%M UTC')|" index.html
            node -e 'const fs = require("fs"); fs.writeFileSync("index.html", fs.readFileSync("index.html", "utf8").replace("<!--COVERAGE_WARNING-->", () => fs.readFileSync("../coverage-warning.html", "utf8")))'
          fi
          touch .nojekyll

          # One fresh commit each time, so the branch never grows with old reports.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan latest 2>/dev/null || git checkout -B latest
          git add -A
          git commit -m "Publish reports from run #${{ github.run_number }}"
          git push --force origin latest:gh-pages

      # Does not fail the job: the reports are published either way, and a red shard already makes the run red.
      # It only puts the problem where people look: an error annotation and the summary of the run.
      - name: Show the test problems in the run
        if: ${{ !cancelled() && steps.coverage.outputs.ok == 'false' }}
        run: |
          message=$(cat coverage-message.txt)
          echo "::error title=Tests missing or failed::$message"
          { echo "### Tests missing or failed"; echo; echo "$message"; } >> "$GITHUB_STEP_SUMMARY"
