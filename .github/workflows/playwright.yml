name: Playwright tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      canary:
        description: "Canary run: spoil one value in every test on purpose, every test has to FAIL. Reports go to the canary/ folder of gh-pages, the real reports are not touched"
        type: boolean
        default: false
  schedule:
    # every night at 01:30 IST (GitHub cron runs in UTC: 20:00 UTC = 01:30 IST the next morning)
    - cron: "0 20 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    env:
      # RunConfig reads this: true only for the nightly run, which then uses the ...CI keys in configs/runconfig.json
      IS_CRON: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The package download on the runner sometimes hangs (one shard waited 90 minutes and was cancelled).
      # Each try is stopped after 8 minutes and tried again, up to 3 times.
      - name: Install Chromium
        timeout-minutes: 30
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=20 480 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Install attempt $attempt failed or timed out"
            sleep 10
          done
          exit 1

      # the reporters (blob for the merged HTML report, allure-results) and the other CI settings come from playwright.config.ts (CI=true)
      - name: Run Playwright tests
        env:
          CANARY: ${{ inputs.canary }}
        run: npx playwright test tests/YtMasterSafeActions.spec.ts --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 7

      - name: Upload allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shardIndex }}
          path: allure-results
          retention-days: 7

  merge-reports:
    name: Merge reports
    needs: test
    # run even when some shards failed, so the report is always produced
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # needed to push the reports to the gh-pages branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports from all shards
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      # the same results as a json file, to count the tests in the last step
      - name: Merge into one json file
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-results.json
        run: npx playwright merge-reports --reporter=json ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      # allure-commandline needs Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download allure results from all shards
        uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true

      # The gh-pages branch holds the published reports; we need the previous Allure report
      # from it to carry the trend history forward. On the very first run the branch does not exist yet.
      - name: Check whether gh-pages exists
        id: pages_branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out gh-pages
        if: steps.pages_branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Start an empty site folder (first run only)
        if: steps.pages_branch.outputs.exists != 'true'
        run: |
          mkdir site
          cd site
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Copy previous Allure history (for trend graphs)
        run: |
          if [ -d site/allure/history ]; then
            cp -r site/allure/history allure-results/history
          fi

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      # ---- Publish ----
      # Pull requests only build the reports; pushes to main or master and manual runs publish.

      # A canary run is switched on by the "canary" input of a manual run or by "CANARY": true in configs/runconfig.json
      - name: Is this a canary run?
        id: canary
        run: |
          if [ "${{ inputs.canary }}" = "true" ] || [ "$(node -p "require('./configs/runconfig.json').CANARY === true")" = "true" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi

      # A green report must not hide lost tests (once a shard waited 90 minutes in the Chromium install and was cancelled).
      # Simple check: the number of tests with a result has to equal the number of tests in the spec, and every shard has to send a report.
      # Only when they differ, the tests of the spec that have no result are listed. The problem is written into a red box
      # on the report page; the job is failed at the very end, after the publish.
      - name: Check that all shards ran and all tests completed
        id: coverage
        run: |
          shards_expected=4   # shardTotal of the test job
          shards_found=$(ls all-blob-reports/*.zip | wc -l)
          npx playwright test tests/YtMasterSafeActions.spec.ts --list | grep ' › ' | sed 's/.* › //' > tests-in-spec.txt
          node -p 'const t = []; (function walk(s) { (s.specs || []).forEach(x => t.push(x.title)); (s.suites || []).forEach(walk); })(require("./merged-results.json")); t.join("\n")' > tests-with-result.txt
          tests_expected=$(wc -l < tests-in-spec.txt)
          tests_found=$(wc -l < tests-with-result.txt)
          echo "Shards: $shards_found of $shards_expected | tests with a result: $tests_found of $tests_expected"

          if [ "$shards_found" -eq "$shards_expected" ] && [ "$tests_found" -eq "$tests_expected" ]; then
            : > coverage-warning.html
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            # the tests of the spec that have no result at all
            missing=$(grep -vxFf tests-with-result.txt tests-in-spec.txt | sed ':a;N;$!ba;s/\n/, /g')
            echo "Did not run: $missing"
            echo "<div class=\"warning\"><strong>Only $tests_found of $tests_expected tests have a result in this report</strong> ($shards_found of $shards_expected shards sent a report). A shard was probably cancelled or failed before the tests started. Tests that did not run: $missing</div>" > coverage-warning.html
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to gh-pages
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          cd site
          if [ "${{ steps.canary.outputs.on }}" = "true" ]; then
            # Canary run: the reports go to canary/ and the real reports stay as they are.
            rm -rf canary
            mkdir canary
            cp -r ../playwright-report canary/playwright
            cp -r ../allure-report canary/allure
          else
            # Start from a clean folder: remove the old reports, then add the new ones.
            rm -rf playwright allure index.html
            cp -r ../playwright-report playwright
            cp -r ../allure-report allure
            cp ../.github/pages/index.html index.html
            sed -i "s|__RUN_INFO__|Run #${{ github.run_number }} - commit ${GITHUB_SHA::7} - $(date -u +'%Y-%m-%d %H:%M UTC')|" index.html
            node -e 'const fs = require("fs"); fs.writeFileSync("index.html", fs.readFileSync("index.html", "utf8").replace("<!--COVERAGE_WARNING-->", () => fs.readFileSync("../coverage-warning.html", "utf8")))'
          fi
          touch .nojekyll

          # One fresh commit each time, so the branch never grows with old reports.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan latest 2>/dev/null || git checkout -B latest
          git add -A
          git commit -m "Publish reports from run #${{ github.run_number }}"
          git push --force origin latest:gh-pages

      - name: Fail the job when tests are missing
        if: ${{ !cancelled() && steps.coverage.outputs.ok == 'false' }}
        run: |
          echo "::error::Some tests have no result in the report, see the red box on the report page"
          exit 1
